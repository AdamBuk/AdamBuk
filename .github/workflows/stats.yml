name: Statistiky profilu

on:
  schedule:
    - cron: '17 4 * * *'   # každý den ráno
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vygenerovat karty
        run: node scripts/generate-stats.mjs
        env:
          # Fine-grained token jen pro čtení (Contents + Metadata: Read) — viz README skriptu
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
      - name: Uložit změny
        run: |
          if git diff --quiet -- assets; then echo "Beze změny."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: aktualizace statistik"
          git push
